<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Real-time graphic equalizer that visualizes microphone input – PWA" />
  <meta name="theme-color" content="#7c3aed" />

  <!-- PWA -->
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />

  <link rel="stylesheet" href="styles.css" />
  <title>Mnusic Visualizer</title>
</head>
<body>

  <header>
    <h1>🎵 Mnusic Visualizer</h1>
    <p>Real-time graphic equalizer from your microphone</p>
  </header>

  <!-- Canvas wrapper -->
  <div id="visualizer-wrapper">
    <canvas id="eq-canvas" role="img" aria-label="Graphic equalizer visualization"></canvas>

    <!-- Shown until user grants mic permission -->
    <div id="overlay">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
           stroke="currentColor" stroke-width="1.5" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round"
          d="M12 18.75a6 6 0 006-6v-1.5m-6 7.5a6 6 0 01-6-6v-1.5m6 7.5v3.75m-3.75 0h7.5
             M12 15.75a3 3 0 01-3-3V4.5a3 3 0 116 0v8.25a3 3 0 01-3 3z" />
      </svg>
      <p>Click <strong>Start</strong> and allow microphone access to see the equalizer</p>
    </div>
  </div>

  <!-- Controls -->
  <div class="controls">
    <button id="btn-start" aria-label="Start visualizer">
      <!-- play icon -->
      <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="currentColor"
           viewBox="0 0 16 16" aria-hidden="true">
        <path d="M11.596 8.697l-6.363 3.692C4.705 12.69 4 12.294 4
                 11.692V4.308c0-.602.705-.998 1.233-.697l6.363 3.692a.802.802 0 010 1.394z"/>
      </svg>
      Start
    </button>
    <button id="btn-stop" disabled aria-label="Stop visualizer">
      <!-- stop icon -->
      <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="currentColor"
           viewBox="0 0 16 16" aria-hidden="true">
        <path d="M5 3.5h6A1.5 1.5 0 0112.5 5v6a1.5 1.5 0 01-1.5 1.5H5A1.5 1.5 0 013.5
                 11V5A1.5 1.5 0 015 3.5z"/>
      </svg>
      Stop
    </button>
  </div>

  <!-- Settings -->
  <div class="settings">
    <div class="setting-group">
      <label for="sel-bands">Bands</label>
      <select id="sel-bands">
        <option value="16">16</option>
        <option value="32" selected>32</option>
        <option value="64">64</option>
        <option value="128">128</option>
      </select>
    </div>

    <div class="setting-group">
      <label for="sel-mode">Mode</label>
      <select id="sel-mode">
        <option value="bars" selected>Bars</option>
        <option value="line">Line</option>
        <option value="both">Both</option>
      </select>
    </div>

    <div class="setting-group">
      <label for="range-gain">Gain <span id="lbl-gain">1.0×</span></label>
      <input id="range-gain" type="range" min="0.5" max="5" step="0.1" value="1.0" />
    </div>
  </div>

  <!-- Status -->
  <div id="status-bar" role="status" aria-live="polite">
    <span id="status-text">Ready – press Start to begin</span>
  </div>

  <script src="app.js" defer></script>
</body>
</html>
